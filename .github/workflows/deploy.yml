# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just building and deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Action majors are pinned to the lowest one that runs on Node 24, since
      # GitHub now force-runs Node 20 actions on 24 and warns about it. That is
      # v5 for most of these but NOT for configure-pages, whose v5 is still a
      # node20 action — it needs v6. upload-pages-artifact is a composite that
      # wraps upload-artifact, so its version is what decides that one: v3 calls
      # upload-artifact@v4 (node20), v5 calls v7. Check `runs.using` in an
      # action's own action.yml before assuming a bump fixes the warning.
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          # set this repository variable to the deployed worker url to enable the chat box;
          # left unset it expands to an empty string and the chat stays disabled
          VITE_ASK_ENDPOINT: ${{ vars.VITE_ASK_ENDPOINT }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
